<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking Studio</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#e3e7ed;--navy:#10233e;--blue:#315efb;--soft:#f5f7ff;--green:#11845e;--yellow:#fff1a8;--red:#ffd9d9;--shadow:0 14px 36px rgba(16,35,62,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}.headin{max-width:1480px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:850;font-size:19px}.season{font-size:11px;color:var(--muted)}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.wrap{max-width:1480px;margin:auto;padding:22px 20px 50px}.hero{background:linear-gradient(135deg,#10233e,#203b63);color:#fff;border-radius:20px;padding:25px 28px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:#ced7e4;font-size:13px}.stats{margin-left:auto;display:flex;gap:9px}.stat{background:rgba(255,255,255,.09);padding:11px 15px;border-radius:12px;text-align:center;min-width:85px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#c4d0de}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px;margin-bottom:16px}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:9px 11px}select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.result{margin-left:auto;color:var(--muted);font-size:11px}.topicGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.topicCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;box-shadow:0 4px 15px rgba(16,35,62,.03)}.topicCard:hover{border-color:#bdc8ff}.topicTop{display:flex;justify-content:space-between;gap:8px}.topicName{font-size:14px;font-weight:800}.badge{font-size:10px;border-radius:7px;padding:4px 7px;background:#edf1f5;color:#536071;white-space:nowrap}.topicMeta{margin-top:8px;color:var(--muted);font-size:11px}.progress{height:5px;background:#edf0f3;border-radius:999px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green)}.empty{padding:48px;text-align:center;color:var(--muted);grid-column:1/-1}#practice{display:none}.back{margin-bottom:12px}.practiceGrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.phead{padding:16px;border-bottom:1px solid var(--line)}.phead h2{margin:4px 0 0;font-size:19px}.meta{font-size:11px;color:var(--blue);font-weight:800}.qlist{padding:8px;max-height:calc(100vh - 210px);overflow:auto}.qitem{padding:10px;border-radius:10px;border:1px solid transparent;margin-bottom:4px;display:flex;gap:9px;cursor:pointer}.qitem.on{background:var(--soft);border-color:#d4dcff}.qnum{width:24px;height:24px;border-radius:7px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:0 0 auto}.qitem.on .qnum{background:var(--blue);color:#fff}.qtxt{font-size:12px;line-height:1.45}.qstatus{margin-left:auto;white-space:nowrap;font-size:9px;padding:3px 6px;border-radius:999px;background:#eef1f4;color:#78828e;height:max-content}.qstatus.done{background:#e8f7f1;color:#0d7a56}.editor{padding:19px}.currentQ{font-size:18px;line-height:1.55;font-weight:800;margin-bottom:12px}.answerLabel{display:flex;justify-content:space-between;font-size:12px;font-weight:750;margin-bottom:7px}textarea{width:100%;min-height:220px;resize:vertical;border:1px solid #d8dee8;border-radius:13px;padding:13px 14px;line-height:1.7;outline:none}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.small{margin-left:auto;color:var(--muted);font-size:11px}.mic.on{background:#c83c3c;color:#fff;border-color:#c83c3c}.review{margin-top:16px;border-top:1px solid var(--line);padding-top:15px}.issues{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:12px;line-height:1.6}.diffBox{display:none;margin-top:12px;background:#fff;border:1px solid #d5dcff;border-radius:12px;padding:13px}.diffBox.show{display:block}.diffTitle{font-size:12px;font-weight:800;margin-bottom:9px}.diffText{font-size:14px;line-height:1.75;white-space:pre-wrap}.add{background:var(--yellow);border-radius:3px;padding:0 2px;font-weight:700}.del{background:var(--red);text-decoration:line-through;color:#8b4646;border-radius:3px;padding:0 2px}.hint{font-size:10px;color:var(--muted);margin-top:8px}.toast{position:fixed;right:22px;bottom:22px;background:#10233e;color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;opacity:0;transform:translateY(7px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:1100px){.topicGrid{grid-template-columns:repeat(3,1fr)}.practiceGrid{grid-template-columns:1fr}.qlist{max-height:none}}@media(max-width:760px){.topicGrid{grid-template-columns:1fr 1fr}.hero{display:block}.stats{margin:15px 0 0}}@media(max-width:520px){.topicGrid{grid-template-columns:1fr}.wrap{padding:15px 12px 35px}}
</style></head><body>
<header><div class="headin"><div><div class="brand">IELTS Speaking Studio</div><div class="season">2026 May–Aug · Mainland China</div></div><div class="spacer"></div><button class="btn" onclick="exportForChatGPT()">导出给 ChatGPT</button><button class="btn" onclick="document.getElementById('importFile').click()">导入 ChatGPT 结果</button><input id="importFile" type="file" accept="application/json,.json" hidden onchange="importFromChatGPT(event)"></div></header>
<div class="wrap"><section id="home"><div class="hero"><div><h1>雅思口语工作台</h1><p>语音练习、本地保存、基础语法检查；可导出题目和答案到 ChatGPT 深度批改，再一键导回。</p></div><div class="stats"><div class="stat"><b id="statTopics">0</b><span>话题</span></div><div class="stat"><b id="statQuestions">0</b><span>小题</span></div><div class="stat"><b id="statAnswered">0</b><span>已作答</span></div></div></div>
<div class="toolbar"><input id="search" class="search" placeholder="搜索话题或题目…" oninput="renderHome()"><button class="chip on" data-part="all" onclick="partChip('all',this)">全部</button><button class="chip" data-part="Part 1" onclick="partChip('Part 1',this)">Part 1</button><button class="chip" data-part="Part 2 / Part 3" onclick="partChip('Part 2 / Part 3',this)">Part 2 & 3</button><select id="region" onchange="renderHome()"><option value="all">全部题库</option><option value="中国大陆">中国大陆完整题库</option><option value="我的已答题">我的已答题</option></select><select id="status" onchange="renderHome()"><option value="all">全部状态</option><option value="answered">已作答</option><option value="unanswered">未作答</option></select><button class="btn" onclick="clearFilters()">清除筛选</button><span id="resultCount" class="result"></span></div><div id="topicGrid" class="topicGrid"></div></section>
<section id="practice"><button class="btn back" onclick="goHome()">← 返回主题首页</button><div class="practiceGrid"><aside class="panel"><div class="phead"><div id="pmeta" class="meta"></div><h2 id="ptitle"></h2></div><div id="qlist" class="qlist"></div></aside><main class="panel"><div class="editor"><div id="currentQ" class="currentQ"></div><div class="answerLabel"><span>当前答案</span><span id="wordLabel"></span></div><textarea id="answer" placeholder="未作答。可直接输入，或点击麦克风进行英文语音输入。" oninput="answerInput()"></textarea><div class="bar"><button id="mic" class="btn mic" onclick="toggleSpeech()">🎙 语音输入</button><button class="btn primary" onclick="grammarCheck()">✓ 语法检查</button><button class="btn" onclick="save()">保存</button><button class="btn" onclick="restoreDefault()">恢复本题</button><span id="speechStatus" class="small">未录音</span></div><div class="review"><div class="issues"><b>检查结果</b><ul id="issues"><li>点击“语法检查”后显示基础语法问题；深度 IELTS 批改请使用顶部导出/导入。</li></ul></div><div id="diffBox" class="diffBox"><div class="diffTitle">修改对比 · 高亮处为变化内容</div><div id="diffText" class="diffText"></div><div class="hint">黄色＝新增/替换；红色删除。导入 ChatGPT 整改结果后也会在这里显示对比。</div></div></div></div></main></div></section></div><div id="toast" class="toast"></div>
<script src="data-01.js"></script><script src="data-02.js"></script><script src="data-03.js"></script><script src="data-04.js"></script><script src="data-05.js"></script><script src="data-06.js"></script><script src="data-07.js"></script>
<script>
const DATA=window.IELTS_DATA||[],KEY='ielts-speaking-static-v4';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let partFilter='all',activeTopic=null,qIndex=0,recognition=null,listening=false,importDiff={};
const k=(r,i)=>r.id+'::'+i;function def(r,i){return r.savedAnswers?.[String(i)]?.answer||''}function ans(r,i){return saved[k(r,i)]!==undefined?saved[k(r,i)]:def(r,i)}function persist(){localStorage.setItem(KEY,JSON.stringify(saved));updateStats()}function esc(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function doneCount(r){return r.questions.filter((_,i)=>ans(r,i).trim()).length}
function visibleTopics(){const q=(document.getElementById('search')?.value||'').trim().toLowerCase(),reg=document.getElementById('region')?.value||'all',st=document.getElementById('status')?.value||'all';return DATA.map((r,i)=>({r,i})).filter(o=>{if(partFilter!=='all'&&o.r.part!==partFilter)return false;if(reg!=='all'&&o.r.region!==reg)return false;const d=doneCount(o.r);if(st==='answered'&&d===0)return false;if(st==='unanswered'&&d===o.r.questions.length)return false;if(q&&!((o.r.title+' '+o.r.questions.join(' ')).toLowerCase().includes(q)))return false;return true})}
function renderHome(){const fs=visibleTopics();document.getElementById('resultCount').textContent=`${fs.length} 个话题`;document.getElementById('topicGrid').innerHTML=fs.length?fs.map(o=>{const d=doneCount(o.r),pct=Math.round(d/o.r.questions.length*100);return `<div class="topicCard" onclick="openTopic(${o.i})"><div class="topicTop"><div class="topicName">${esc(o.r.title)}</div><div class="badge">${esc(o.r.part)}</div></div><div class="topicMeta">${o.r.region==='中国大陆'?'Topic '+o.r.topicNo+' · ':''}${d} / ${o.r.questions.length} 已作答</div><div class="progress"><i style="width:${pct}%"></i></div></div>`}).join(''):'<div class="empty">没有符合当前筛选条件的话题。</div>'}
function partChip(p,el){partFilter=p;document.querySelectorAll('.chip[data-part]').forEach(x=>x.classList.remove('on'));el.classList.add('on');renderHome()}function clearFilters(){partFilter='all';search.value='';region.value='all';status.value='all';document.querySelectorAll('.chip[data-part]').forEach(x=>x.classList.toggle('on',x.dataset.part==='all'));renderHome()}
function openTopic(i){activeTopic=i;qIndex=0;home.style.display='none';practice.style.display='block';renderPractice();scrollTo(0,0)}function goHome(){practice.style.display='none';home.style.display='block';renderHome();scrollTo(0,0)}function renderPractice(){const r=DATA[activeTopic];pmeta.textContent=`${r.region}${r.region==='中国大陆'?' · Topic '+r.topicNo:''} · ${r.part}`;ptitle.textContent=r.title;qlist.innerHTML=r.questions.map((q,i)=>`<div class="qitem ${i===qIndex?'on':''}" onclick="selectQ(${i})"><span class="qnum">${i+1}</span><span class="qtxt">${esc(q)}</span><span class="qstatus ${ans(r,i).trim()?'done':''}">${ans(r,i).trim()?'已答':'未作答'}</span></div>`).join('');loadQ()}function selectQ(i){qIndex=i;renderPractice()}
function loadQ(){const r=DATA[activeTopic];currentQ.textContent=r.questions[qIndex];answer.value=ans(r,qIndex);wordCount();issues.innerHTML='<li>点击“语法检查”后显示基础语法问题；深度 IELTS 批改请使用顶部导出/导入。</li>';diffBox.classList.remove('show');const d=importDiff[k(r,qIndex)];if(d){diffText.innerHTML=diffHtml(d.before,d.after);diffBox.classList.add('show');issues.innerHTML=(d.diagnosis?.length?d.diagnosis:['已从 ChatGPT 导入整改答案。']).map(x=>'<li>'+esc(x)+'</li>').join('')}}function answerInput(){const r=DATA[activeTopic];saved[k(r,qIndex)]=answer.value;wordCount()}function save(){answerInput();persist();renderPractice();toast('已保存')}function restoreDefault(){const r=DATA[activeTopic];saved[k(r,qIndex)]=def(r,qIndex);delete importDiff[k(r,qIndex)];persist();renderPractice();toast('已恢复本题默认答案')}function wordCount(){const t=answer.value.trim();wordLabel.textContent=(t?t.split(/\s+/).length:0)+' words'}function updateStats(){statTopics.textContent=DATA.length;statQuestions.textContent=DATA.reduce((n,r)=>n+r.questions.length,0);statAnswered.textContent=DATA.reduce((n,r)=>n+doneCount(r),0)}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function tokenize(s){return s.split(/(\s+|[,.!?;:])/).filter(Boolean)}function diffHtml(a,b){const A=tokenize(a),B=tokenize(b),n=A.length,m=B.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,out='';while(i<n&&j<m){if(A[i]===B[j]){out+=esc(B[j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])out+=`<span class="del">${esc(A[i++])}</span>`;else out+=`<span class="add">${esc(B[j++])}</span>`}while(i<n)out+=`<span class="del">${esc(A[i++])}</span>`;while(j<m)out+=`<span class="add">${esc(B[j++])}</span>`;return out}
async function grammarCheck(){const before=answer.value.trim();if(!before){toast('请先作答');return}speechStatus.textContent='正在检查…';let corrected=before,notes=[];if(/\b(uh|um)\b/i.test(before))notes.push('存在 uh / um 等填充词。');if(/\b(\w+)\s+\1\b/i.test(before))notes.push('检测到连续重复词。');try{const body=new URLSearchParams({text:before,language:'en-GB'}),rr=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await rr.json(),ms=(j.matches||[]).filter(m=>m.replacements?.length);ms.slice(0,12).forEach(m=>notes.push(m.message+(m.replacements[0]?` → ${m.replacements[0].value}`:'')));[...ms].sort((a,b)=>b.offset-a.offset).forEach(m=>corrected=corrected.slice(0,m.offset)+m.replacements[0].value+corrected.slice(m.offset+m.length));speechStatus.textContent='语法检查完成'}catch(e){speechStatus.textContent='本地检查完成'}if(!notes.length)notes=['未发现明显基础语法问题。'];issues.innerHTML=notes.map(x=>'<li>'+esc(x)+'</li>').join('');answer.value=corrected;answerInput();persist();diffText.innerHTML=diffHtml(before,corrected);diffBox.classList.add('show');toast('语法检查完成')}
function toggleSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('建议使用 Chrome / Edge');return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;let base=answer.value.trim();recognition.onstart=()=>{listening=true;mic.classList.add('on');mic.textContent='■ 停止语音';speechStatus.textContent='正在听…'};recognition.onresult=e=>{let f='',it='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;e.results[i].isFinal?f+=s:it+=s}if(f){base=(base?base+' ':'')+f.trim();answer.value=base;answerInput()}speechStatus.textContent=it?'识别中：'+it:'正在听…'};recognition.onend=()=>{listening=false;mic.classList.remove('on');mic.textContent='🎙 语音输入';speechStatus.textContent='语音结束';save()};recognition.start()}
function exportForChatGPT(){const items=[];DATA.forEach(r=>r.questions.forEach((q,i)=>{const a=ans(r,i).trim();if(a)items.push({id:k(r,i),topic:r.title,part:r.part,question:q,answer:a,revised_answer:a,diagnosis:[]})}));if(!items.length){toast('目前没有已作答题目');return}const payload={format:'ielts-speaking-review-v1',instructions:'请逐题按 IELTS Speaking 对应 Part 批改。保留原有个人内容和观点，不要换故事。Part 1 简洁自然；Part 2 检查 cue card 要点和连贯展开；Part 3 检查观点-原因-解释/例子链路。请修正语法、搭配、中式英语和书面腔。只修改 revised_answer，并在 diagnosis 中用中文列出 1-4 条最重要的问题。必须保留每条 id，不要增删题目，最后把完整 JSON 文件返回给我，结构保持不变。',exported_at:new Date().toISOString(),items};downloadJSON(payload,'ielts-speaking-for-chatgpt.json');toast(`已导出 ${items.length} 道已答题`)}
function downloadJSON(obj,name){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importFromChatGPT(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.format!=='ielts-speaking-review-v1'||!Array.isArray(obj.items))throw new Error('文件格式不匹配');let n=0;for(const it of obj.items){if(!it.id||typeof it.revised_answer!=='string')continue;const parts=it.id.split('::'),rid=parts[0],qi=Number(parts[1]),r=DATA.find(x=>x.id===rid);if(!r||!Number.isInteger(qi)||!r.questions[qi])continue;const before=ans(r,qi),after=it.revised_answer.trim();if(!after)continue;saved[it.id]=after;importDiff[it.id]={before,after,diagnosis:Array.isArray(it.diagnosis)?it.diagnosis:[]};n++}persist();renderHome();if(activeTopic!==null&&practice.style.display!=='none')renderPractice();toast(`已导入 ${n} 道 ChatGPT 整改答案`)}catch(err){toast('导入失败：'+err.message)}}
renderHome();updateStats();
</script></body></html>

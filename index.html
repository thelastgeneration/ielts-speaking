<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Speaking Studio</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#e3e7ed;--navy:#10233e;--blue:#315efb;--soft:#f5f7ff;--green:#11845e;--shadow:0 14px 36px rgba(16,35,62,.08);--yellow:#fff1a8;--red:#ffd9d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.headin{max-width:1480px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:16px}.brand{font-weight:850;font-size:19px}.season{font-size:11px;color:var(--muted)}.headspacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.wrap{max-width:1480px;margin:auto;padding:22px 20px 50px}.hero{background:linear-gradient(135deg,#10233e,#203b63);color:#fff;border-radius:20px;padding:26px 28px;display:flex;gap:25px;align-items:center;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{font-size:28px;margin:0 0 7px}.hero p{margin:0;color:#ced7e4;font-size:13px}.heroStats{margin-left:auto;display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:10px}.heroStat{background:rgba(255,255,255,.09);padding:12px 14px;border-radius:13px;text-align:center}.heroStat b{display:block;font-size:21px}.heroStat span{font-size:10px;color:#c4d0de}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px;margin-bottom:16px}.search{flex:1;min-width:230px;border:1px solid var(--line);border-radius:10px;padding:9px 11px}select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.result{margin-left:auto;color:var(--muted);font-size:11px}
.homeTitle{font-size:16px;margin:18px 2px 10px}.topicGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.topicCard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 4px 15px rgba(16,35,62,.03);cursor:pointer;transition:.15s}.topicCard:hover{transform:translateY(-2px);border-color:#bdc8ff}.topicTop{display:flex;gap:8px;justify-content:space-between}.topicName{font-size:14px;font-weight:800}.badge{font-size:10px;border-radius:7px;padding:4px 7px;background:#edf1f5;color:#536071;white-space:nowrap}.topicMeta{margin-top:8px;color:var(--muted);font-size:11px}.progress{height:5px;background:#edf0f3;border-radius:999px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green)}
.empty{padding:50px 15px;text-align:center;color:var(--muted);grid-column:1/-1}
#practice{display:none}.back{margin-bottom:12px}.practiceGrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.phead{padding:16px;border-bottom:1px solid var(--line)}.phead h2{margin:4px 0 0;font-size:19px}.meta{font-size:11px;color:var(--blue);font-weight:800}.qlist{padding:8px;max-height:calc(100vh - 210px);overflow:auto}.qitem{padding:10px;border-radius:10px;border:1px solid transparent;margin-bottom:4px;display:flex;gap:9px;cursor:pointer}.qitem:hover{background:#f8fafc}.qitem.on{background:var(--soft);border-color:#d4dcff}.qnum{width:24px;height:24px;border-radius:7px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:0 0 auto}.qitem.on .qnum{background:var(--blue);color:#fff}.qtxt{font-size:12px;line-height:1.45}.qstatus{margin-left:auto;white-space:nowrap;font-size:9px;padding:3px 6px;border-radius:999px;background:#eef1f4;color:#78828e;height:max-content}.qstatus.done{background:#e8f7f1;color:#0d7a56}
.editor{padding:19px}.currentQ{font-size:18px;line-height:1.55;font-weight:800;margin-bottom:12px}.answerLabel{display:flex;justify-content:space-between;font-size:12px;font-weight:750;margin-bottom:7px}textarea{width:100%;min-height:220px;resize:vertical;border:1px solid #d8dee8;border-radius:13px;padding:13px 14px;line-height:1.7;outline:none}textarea:focus{border-color:#8195ff;box-shadow:0 0 0 3px rgba(49,94,251,.08)}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.small{margin-left:auto;color:var(--muted);font-size:11px}.mic.on{background:#c83c3c;color:#fff;border-color:#c83c3c}
.review{margin-top:16px;border-top:1px solid var(--line);padding-top:15px}.issues{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:12px;line-height:1.6}.diffBox{display:none;margin-top:12px;background:#fff;border:1px solid #d5dcff;border-radius:12px;padding:13px}.diffBox.show{display:block}.diffTitle{font-size:12px;font-weight:800;margin-bottom:9px}.diffText{font-size:14px;line-height:1.75;white-space:pre-wrap}.add{background:var(--yellow);border-radius:3px;padding:0 2px;font-weight:700}.del{background:var(--red);text-decoration:line-through;color:#8b4646;border-radius:3px;padding:0 2px}.hint{font-size:10px;color:var(--muted);margin-top:8px}
.toast{position:fixed;right:22px;bottom:22px;background:#10233e;color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;opacity:0;transform:translateY(7px);transition:.18s}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.topicGrid{grid-template-columns:repeat(3,1fr)}.practiceGrid{grid-template-columns:1fr}.qlist{max-height:none}}@media(max-width:760px){.topicGrid{grid-template-columns:1fr 1fr}.hero{display:block}.heroStats{margin:16px 0 0}}@media(max-width:520px){.topicGrid{grid-template-columns:1fr}.wrap{padding:15px 12px 35px}}
</style></head><body>
<header><div class="headin"><div><div class="brand">IELTS Speaking Studio</div><div class="season">2026 May–Aug · Mainland China</div></div><div class="headspacer"></div><button class="btn" onclick="exportMD()">导出答案</button></div></header>
<div class="wrap">
<section id="home">
<div class="hero"><div><h1>雅思口语工作台</h1><p>先按主题进入，再逐题练习。未作答题全部保留；已有答案直接使用原工作台修改后的版本。</p></div><div class="heroStats"><div class="heroStat"><b id="statTopics">0</b><span>话题</span></div><div class="heroStat"><b id="statQuestions">0</b><span>小题</span></div><div class="heroStat"><b id="statAnswered">0</b><span>已作答</span></div></div></div>
<div class="toolbar">
<input id="search" class="search" placeholder="搜索话题或题目…" oninput="applyFilters()">
<button class="chip on" data-part="all" onclick="partChip('all',this)">全部</button>
<button class="chip" data-part="Part 1" onclick="partChip('Part 1',this)">Part 1</button>
<button class="chip" data-part="Part 2 / Part 3" onclick="partChip('Part 2 / Part 3',this)">Part 2 & 3</button>
<select id="region" onchange="applyFilters()"><option value="all">全部题库</option><option value="中国大陆">中国大陆完整题库</option><option value="我的已答题">我的已答题</option></select>
<select id="status" onchange="applyFilters()"><option value="all">全部状态</option><option value="answered">已作答</option><option value="unanswered">未作答</option></select>
<button class="btn" onclick="clearFilters()">清除筛选</button><span id="resultCount" class="result"></span>
</div>
<h2 class="homeTitle">主题</h2><div id="topicGrid" class="topicGrid"></div>
</section>
<section id="practice"><button class="btn back" onclick="goHome()">← 返回主题首页</button><div class="practiceGrid">
<aside class="panel"><div class="phead"><div id="pmeta" class="meta"></div><h2 id="ptitle"></h2></div><div id="qlist" class="qlist"></div></aside>
<main class="panel"><div class="editor"><div id="currentQ" class="currentQ"></div><div class="answerLabel"><span>当前答案</span><span id="wordLabel"></span></div><textarea id="answer" placeholder="未作答。可直接输入，或点击麦克风进行英文语音输入。" oninput="answerInput()"></textarea><div class="bar"><button id="mic" class="btn mic" onclick="toggleSpeech()">🎙 语音输入</button><button class="btn primary" onclick="checkUpdate()">✓ 检查并更新</button><button class="btn" onclick="save()">保存</button><button class="btn" onclick="restoreDefault()">恢复本题</button><span id="speechStatus" class="small">未录音</span></div><div class="review"><div class="issues"><b>检查结果</b><ul id="issues"><li>点击“检查并更新”后显示。</li></ul></div><div id="diffBox" class="diffBox"><div class="diffTitle">修改后答案 · 高亮处为变化内容</div><div id="diffText" class="diffText"></div><div class="hint">黄色＝新增/替换；红色删除内容仅用于对比，不会写回当前答案。</div></div></div></div></main>
</div></section></div><div id="toast" class="toast"></div>
<script src="data-01.js"></script><script src="data-02.js"></script><script src="data-03.js"></script><script src="data-04.js"></script><script src="data-05.js"></script><script src="data-06.js"></script><script src="data-07.js"></script><script>
const DATA=window.IELTS_DATA;const KEY='ielts-speaking-static-v3';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let partFilter='all',activeTopic=null,qIndex=0,recognition=null,listening=false,preCheck='';
const k=(r,i)=>r.id+'::'+i;function def(r,i){return r.savedAnswers?.[String(i)]?.answer||''}function ans(r,i){return saved[k(r,i)]!==undefined?saved[k(r,i)]:def(r,i)}function persist(){localStorage.setItem(KEY,JSON.stringify(saved));updateStats()}
function esc(s){return(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function answeredTopic(r){return r.questions.filter((_,i)=>ans(r,i).trim()).length}
function visibleTopics(){const q=(document.getElementById('search')?.value||'').trim().toLowerCase(),reg=document.getElementById('region')?.value||'all',st=document.getElementById('status')?.value||'all';return DATA.map((r,i)=>({r,i})).filter(o=>{if(partFilter!=='all'&&o.r.part!==partFilter)return false;if(reg!=='all'&&o.r.region!==reg)return false;const done=answeredTopic(o.r);if(st==='answered'&&done===0)return false;if(st==='unanswered'&&done===o.r.questions.length)return false;if(q&&!((o.r.title+' '+o.r.questions.join(' ')).toLowerCase().includes(q)))return false;return true})}
function applyFilters(){renderHome()}function partChip(p,el){partFilter=p;document.querySelectorAll('.chip[data-part]').forEach(x=>x.classList.remove('on'));el.classList.add('on');renderHome()}function clearFilters(){partFilter='all';document.getElementById('search').value='';document.getElementById('region').value='all';document.getElementById('status').value='all';document.querySelectorAll('.chip[data-part]').forEach(x=>x.classList.toggle('on',x.dataset.part==='all'));renderHome()}
function renderHome(){const fs=visibleTopics();document.getElementById('resultCount').textContent=`${fs.length} 个话题`;document.getElementById('topicGrid').innerHTML=fs.length?fs.map(o=>{const d=answeredTopic(o.r),pct=Math.round(d/o.r.questions.length*100);return `<div class="topicCard" onclick="openTopic(${o.i})"><div class="topicTop"><div class="topicName">${esc(o.r.title)}</div><div class="badge">${esc(o.r.part)}</div></div><div class="topicMeta">${o.r.region==='中国大陆'?'Topic '+o.r.topicNo+' · ':''}${d} / ${o.r.questions.length} 已作答</div><div class="progress"><i style="width:${pct}%"></i></div></div>`}).join(''):'<div class="empty">没有符合当前筛选条件的话题。点击“清除筛选”恢复全部。</div>'}
function openTopic(i){activeTopic=i;qIndex=0;document.getElementById('home').style.display='none';document.getElementById('practice').style.display='block';renderPractice();window.scrollTo(0,0)}function goHome(){document.getElementById('practice').style.display='none';document.getElementById('home').style.display='block';renderHome();window.scrollTo(0,0)}
function renderPractice(){const r=DATA[activeTopic];document.getElementById('pmeta').textContent=`${r.region}${r.region==='中国大陆'?' · Topic '+r.topicNo:''} · ${r.part}`;document.getElementById('ptitle').textContent=r.title;document.getElementById('qlist').innerHTML=r.questions.map((q,i)=>`<div class="qitem ${i===qIndex?'on':''}" onclick="selectQ(${i})"><span class="qnum">${i+1}</span><span class="qtxt">${esc(q)}</span><span class="qstatus ${ans(r,i).trim()?'done':''}">${ans(r,i).trim()?'已答':'未作答'}</span></div>`).join('');loadQ()}
function selectQ(i){qIndex=i;renderPractice()}function loadQ(){const r=DATA[activeTopic];document.getElementById('currentQ').textContent=r.questions[qIndex];document.getElementById('answer').value=ans(r,qIndex);document.getElementById('issues').innerHTML='<li>点击“检查并更新”后显示。</li>';document.getElementById('diffBox').classList.remove('show');wordCount()}
function answerInput(){const r=DATA[activeTopic];saved[k(r,qIndex)]=document.getElementById('answer').value;wordCount()}function save(){answerInput();persist();renderPractice();toast('已保存')}function restoreDefault(){const r=DATA[activeTopic];saved[k(r,qIndex)]=def(r,qIndex);persist();renderPractice();toast('已恢复本题默认答案')}
function wordCount(){const t=document.getElementById('answer').value.trim(),n=t?t.split(/\s+/).length:0;document.getElementById('wordLabel').textContent=n+' words'}function updateStats(){document.getElementById('statTopics').textContent=DATA.length;document.getElementById('statQuestions').textContent=DATA.reduce((n,r)=>n+r.questions.length,0);document.getElementById('statAnswered').textContent=DATA.reduce((n,r)=>n+r.questions.filter((_,i)=>ans(r,i).trim()).length,0)}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function tokenize(s){return s.split(/(\s+|[,.!?;:])/).filter(x=>x!=='')}function diffHtml(a,b){const A=tokenize(a),B=tokenize(b),n=A.length,m=B.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,out='';while(i<n&&j<m){if(A[i]===B[j]){out+=esc(B[j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out+=`<span class="del">${esc(A[i])}</span>`;i++}else{out+=`<span class="add">${esc(B[j])}</span>`;j++}}while(i<n)out+=`<span class="del">${esc(A[i++])}</span>`;while(j<m)out+=`<span class="add">${esc(B[j++])}</span>`;return out}
function localIssues(t){const out=[];if(/\b(uh|um)\b/i.test(t))out.push('存在 uh / um 等填充词，可用短停顿替代。');if(/\b(\w+)\s+\1\b/i.test(t))out.push('检测到连续重复词。');if(t.trim().split(/\s+/).length<15)out.push('答案较短，可以补充原因、例子或感受。');return out}
async function checkUpdate(){let before=document.getElementById('answer').value.trim();if(!before){toast('请先作答');return}preCheck=before;document.getElementById('speechStatus').textContent='正在检查…';let issues=localIssues(before),correct=before;try{const body=new URLSearchParams({text:before,language:'en-GB'});const rr=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const j=await rr.json();const ms=(j.matches||[]).filter(m=>m.replacements?.length);ms.slice(0,10).forEach(m=>issues.push(m.message+(m.replacements[0]?` → ${m.replacements[0].value}`:'')));[...ms].sort((a,b)=>b.offset-a.offset).forEach(m=>correct=correct.slice(0,m.offset)+m.replacements[0].value+correct.slice(m.offset+m.length));document.getElementById('speechStatus').textContent='在线检查完成'}catch(e){document.getElementById('speechStatus').textContent='本地检查完成'}if(!issues.length)issues=['未发现明显基础语法问题。'];document.getElementById('issues').innerHTML=issues.map(x=>'<li>'+esc(x)+'</li>').join('');document.getElementById('answer').value=correct;answerInput();persist();document.getElementById('diffText').innerHTML=diffHtml(before,correct);document.getElementById('diffBox').classList.add('show');renderPracticeKeepDiff();toast('检查完成，变化内容已高亮')}
function renderPracticeKeepDiff(){const r=DATA[activeTopic];document.getElementById('qlist').innerHTML=r.questions.map((q,i)=>`<div class="qitem ${i===qIndex?'on':''}" onclick="selectQ(${i})"><span class="qnum">${i+1}</span><span class="qtxt">${esc(q)}</span><span class="qstatus ${ans(r,i).trim()?'done':''}">${ans(r,i).trim()?'已答':'未作答'}</span></div>`).join('');wordCount()}
function toggleSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('建议使用 Chrome / Edge');return}if(listening){recognition.stop();return}recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;let base=document.getElementById('answer').value.trim();recognition.onstart=()=>{listening=true;document.getElementById('mic').classList.add('on');document.getElementById('mic').textContent='■ 停止语音';document.getElementById('speechStatus').textContent='正在听…'};recognition.onresult=e=>{let f='',it='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;e.results[i].isFinal?f+=s:it+=s}if(f){base=(base?base+' ':'')+f.trim();document.getElementById('answer').value=base;answerInput()}document.getElementById('speechStatus').textContent=it?'识别中：'+it:'正在听…'};recognition.onend=()=>{listening=false;document.getElementById('mic').classList.remove('on');document.getElementById('mic').textContent='🎙 语音输入';document.getElementById('speechStatus').textContent='语音结束';save()};recognition.start()}
function exportMD(){let out='# IELTS Speaking Answers\n\n';DATA.forEach(r=>{out+=`## ${r.title} · ${r.part}\n\n`;r.questions.forEach((q,i)=>out+=`### Q${i+1}\n${q}\n\n**答案：**\n${ans(r,i)||'未作答'}\n\n`);out+='---\n\n'});const b=new Blob([out],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ielts-speaking-answers.md';a.click();URL.revokeObjectURL(a.href)}
renderHome();updateStats();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking Studio</title><style>body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;margin:0;background:#f4f6f8;color:#172033}#app{max-width:1480px;margin:auto;padding:20px}header{background:#10233e;color:#fff;padding:22px;border-radius:18px;margin-bottom:16px}h1{margin:0 0 6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:#fff;padding:12px;border-radius:12px;margin-bottom:14px}input,select,button,textarea{font:inherit}input,select,button{padding:9px 11px;border:1px solid #dfe4ea;border-radius:9px;background:#fff}input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e3e7ed;border-radius:14px;padding:14px}.card{cursor:pointer}.card:hover{border-color:#315efb}.meta{font-size:11px;color:#667085;margin-top:7px}.practice{display:none}.practiceGrid{display:grid;grid-template-columns:360px 1fr;gap:14px}.q{padding:9px;border-radius:8px;cursor:pointer;font-size:12px}.q.on{background:#eef1ff}.answer{width:100%;min-height:220px;padding:12px;border:1px solid #dfe4ea;border-radius:10px;box-sizing:border-box}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.primary{background:#315efb;color:#fff}.done{color:#11845e;font-weight:700}.diff{margin-top:12px;padding:12px;border:1px solid #d5dcff;border-radius:10px;display:none;line-height:1.7}.add{background:#fff1a8;font-weight:700}.del{background:#ffd9d9;text-decoration:line-through}.empty{text-align:center;padding:50px;color:#667085;grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.practiceGrid{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"><header><h1>IELTS Speaking Studio</h1><div>2026 May–Aug · 雅思口语工作台</div></header><section id="home"><div class="toolbar"><input id="search" placeholder="搜索题目或主题" oninput="renderHome()"><select id="part" onchange="renderHome()"><option value="all">全部 Part</option><option>Part 1</option><option>Part 2</option><option>Part 3</option><option>Part 2 / Part 3</option></select><select id="region" onchange="renderHome()"><option value="all">全部题库</option><option>中国大陆</option><option>我的已答题</option></select><select id="status" onchange="renderHome()"><option value="all">全部状态</option><option value="answered">已作答</option><option value="unanswered">未作答</option></select><button onclick="clearFilters()">清除筛选</button><button onclick="exportMD()">导出答案</button></div><div id="stats" class="meta"></div><div id="grid" class="grid"></div></section><section id="practice" class="practice"><button onclick="goHome()">← 返回首页</button><div class="practiceGrid" style="margin-top:12px"><aside class="panel"><h2 id="topicTitle"></h2><div id="qlist"></div></aside><main class="panel"><h2 id="question"></h2><textarea id="answer" class="answer" placeholder="可输入或使用语音输入" oninput="saveDraft()"></textarea><div class="actions"><button id="mic" onclick="speech()">🎙 语音输入</button><button class="primary" onclick="checkUpdate()">✓ 检查并更新</button><button onclick="saveNow()">保存</button></div><div id="diff" class="diff"></div></main></div></section></div><script src="data-01.js"></script><script src="data-02.js"></script><script src="data-03.js"></script><script src="data-04.js"></script><script src="data-05.js"></script><script src="data-06.js"></script><script src="data-07.js"></script><script>const DATA=window.IELTS_DATA||[],KEY='ielts-speaking-v4';let saved=JSON.parse(localStorage.getItem(KEY)||'{}'),active=-1,qi=0,rec=null;const key=(r,i)=>r.id+'::'+i,def=(r,i)=>r.savedAnswers?.[String(i)]?.answer||'',ans=(r,i)=>saved[key(r,i)]!==undefined?saved[key(r,i)]:def(r,i),esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function count(r){return r.questions.filter((_,i)=>ans(r,i).trim()).length}function filtered(){let s=document.getElementById('search').value.toLowerCase(),p=document.getElementById('part').value,g=document.getElementById('region').value,st=document.getElementById('status').value;return DATA.map((r,i)=>({r,i})).filter(o=>(p==='all'||o.r.part===p)&&(g==='all'||o.r.region===g)&&(st==='all'||(st==='answered'?count(o.r)>0:count(o.r)<o.r.questions.length))&&(!s||(o.r.title+' '+o.r.questions.join(' ')).toLowerCase().includes(s)))}function renderHome(){let f=filtered();document.getElementById('stats').textContent=`${f.length} 个主题 · ${DATA.reduce((n,r)=>n+r.questions.length,0)} 道题 · ${DATA.reduce((n,r)=>n+count(r),0)} 已作答`;document.getElementById('grid').innerHTML=f.length?f.map(o=>`<div class="card" onclick="openTopic(${o.i})"><b>${esc(o.r.title)}</b><div class="meta">${esc(o.r.part)} · ${esc(o.r.region)} · <span class="${count(o.r)?'done':''}">${count(o.r)}/${o.r.questions.length} 已答</span></div></div>`).join(''):'<div class="empty">没有符合筛选条件的题目</div>'}function clearFilters(){search.value='';part.value=region.value=status.value='all';renderHome()}function openTopic(i){active=i;qi=0;home.style.display='none';practice.style.display='block';renderPractice()}function goHome(){practice.style.display='none';home.style.display='block';renderHome()}function renderPractice(){let r=DATA[active];topicTitle.textContent=r.title;qlist.innerHTML=r.questions.map((q,i)=>`<div class="q ${i===qi?'on':''}" onclick="qi=${i};renderPractice()">${i+1}. ${esc(q)} ${ans(r,i).trim()?'<span class="done">✓</span>':''}</div>`).join('');question.textContent=r.questions[qi];answer.value=ans(r,qi);diff.style.display='none'}function saveDraft(){let r=DATA[active];saved[key(r,qi)]=answer.value}function saveNow(){saveDraft();localStorage.setItem(KEY,JSON.stringify(saved));renderPractice()}function toks(s){return s.split(/(\s+|[,.!?;:])/).filter(Boolean)}function diffHTML(a,b){let A=toks(a),B=toks(b),n=A.length,m=B.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=A[i]===B[j]?1+d[i+1][j+1]:Math.max(d[i+1][j],d[i][j+1]);let i=0,j=0,o='';while(i<n&&j<m){if(A[i]===B[j])o+=esc(A[i++]),j++;else if(d[i+1][j]>=d[i][j+1])o+=`<span class="del">${esc(A[i++])}</span>`;else o+=`<span class="add">${esc(B[j++])}</span>`}while(i<n)o+=`<span class="del">${esc(A[i++])}</span>`;while(j<m)o+=`<span class="add">${esc(B[j++])}</span>`;return o}async function checkUpdate(){let before=answer.value.trim();if(!before)return;let corrected=before;try{let body=new URLSearchParams({text:before,language:'en-GB'}),r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body}),j=await r.json();[...(j.matches||[])].filter(x=>x.replacements?.length).sort((a,b)=>b.offset-a.offset).forEach(x=>corrected=corrected.slice(0,x.offset)+x.replacements[0].value+corrected.slice(x.offset+x.length))}catch(e){}answer.value=corrected;saveNow();diff.innerHTML='<b>修改后答案 · 高亮处为变化</b><br><br>'+diffHTML(before,corrected);diff.style.display='block'}function speech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('请使用 Chrome 或 Edge');return}if(rec){rec.stop();rec=null;return}rec=new SR();rec.lang='en-US';rec.continuous=true;let base=answer.value.trim();rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)base+=(base?' ':'')+e.results[i][0].transcript.trim();answer.value=base;saveDraft()};rec.onend=()=>{rec=null;saveNow()};rec.start()}function exportMD(){let out='# IELTS Speaking Answers\n\n';DATA.forEach(r=>{out+=`## ${r.title} · ${r.part}\n\n`;r.questions.forEach((q,i)=>out+=`### Q${i+1}\n${q}\n\n${ans(r,i)||'未作答'}\n\n`)});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/markdown'}));a.download='ielts-speaking-answers.md';a.click()}renderHome();</script></body></html>
